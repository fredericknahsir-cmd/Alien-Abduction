<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>There Here</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="game"></main>
        <h1 id="title">There Here</h1>
        <p id="message">Something strange is happening outside...</p>

        <section class="scene" id="scene">
            <button id="hideBtn">HIDE</button>
            <button id="lightsBtn">TURN OFF</button>
            <button id="runBtn">RUN!</button>
            <button id="waveBtn">WAVE AT THEM</button>
            <div class="stars">
                <span class="star start1"></span>
                <span class="star start2"></span>
                <span class="star start3"></span>
                <span class="star start4"></span>
                <span class="star start5"></span>
                <span class="star start6"></span>
                <span class="star start7"></span>
                <span class="star start8"></span>
            </div>
            <div class="building">
                <div class="window window1"></div>
                <div class="window window2"></div>
                <div class="door"></div>
            </div>
            <div class="ground"></div>
            <div class="person" id="person">
                <div class="head"></div>
                <div class="body"></div>
                <div class="arm arm-left"></div>
                <div class="arm arm-right"></div>
                <div class="leg leg-left"></div>
                <div class="leg leg-right"></div>
            </div>
            <div class="ufo" id="ufo">
                <div class="dome"></div>
                <div class="ship">
                    <span class ="ufo-light light1"></span>
                    <span class ="ufo-light light2"></span>
                    <span class ="ufo-light light3"></span>
            </div>
            </div>
            
        <div class="beam" id="beam"></div>

    </section>
    </main>
    <script src="script.js" defer></script>

    <button id="restartBtn">RESTART</button>
</body>
</html>
